<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Tattoo · Visor</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- A-Frame + MindAR (tracking de imagen) + aframe-extras (animaciones de modelos GLB) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>
  <div class="ar-ui">
    <a href="index.html">← Volver</a>
    <span id="title"></span>
  </div>
  <div class="ar-hint" id="hint">Apunta la cámara al tattoo…</div>
  <div id="stage"></div>

  <script>
    // Girar la vista previa arrastrando con el dedo o el ratón
    AFRAME.registerComponent('drag-rotate', {
      init() {
        let down = false, px = 0, py = 0;
        const el = this.el;
        window.addEventListener('pointerdown', (e) => { down = true; px = e.clientX; py = e.clientY; });
        window.addEventListener('pointerup', () => { down = false; });
        window.addEventListener('pointermove', (e) => {
          if (!down) return;
          const r = el.object3D.rotation;
          r.y += (e.clientX - px) * 0.01;
          r.x = Math.max(-1.5, Math.min(0.3, r.x + (e.clientY - py) * 0.01));
          px = e.clientX; py = e.clientY;
        });
      },
    });
  </script>
  <script type="module">
    import { getTattoo } from './js/config.js';

    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const hint = document.getElementById('hint');

    async function main() {
      const t = await getTattoo(params.get('t'));
      if (!t) throw new Error('No hay tattoos en config/tattoos.json');
      document.getElementById('title').textContent = t.name;

      const preview = params.has('preview');
      const s = t.scale ?? 1;

      // Contenido 3D: efecto programado (js/effects/<nombre>.js), modelo GLB o figura de prueba
      let content;
      if (t.effect) {
        await import(`./js/effects/${t.effect}.js`);
        content = `<a-entity effect-${t.effect}="src: ${t.effectData}; autostart: ${preview}"></a-entity>`;
      } else if (t.model) {
        content = `<a-gltf-model src="#model" ${t.animate ? 'animation-mixer' : ''}
             scale="${s} ${s} ${s}" position="${t.position}" rotation="${t.rotation}"></a-gltf-model>`;
      } else {
        content = `<a-torus-knot color="#ff4f7b" radius="0.25" radius-tubular="0.04"
             scale="${s} ${s} ${s}" position="${t.position}"
             ${t.animate ? 'animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"' : ''}>
           </a-torus-knot>`;
      }

      const assets = t.model ? `<a-asset-item id="model" src="${t.model}"></a-asset-item>` : '';
      const lights = `
          <a-light type="ambient" intensity="1"></a-light>
          <a-light type="directional" position="0.3 1 1" intensity="1.5"></a-light>`;

      if (preview) {
        // Vista previa sin cámara: el marcador como plano + el efecto, arrastra para girar
        hint.textContent = 'Vista previa · arrastra para girar · toca para repetir';
        const img = new Image();
        img.src = t.marker;
        await img.decode();
        const aspect = img.naturalHeight / img.naturalWidth;
        stage.innerHTML = `
          <a-scene renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
            vr-mode-ui="enabled: false" background="color: #18181c">
            <a-assets><img id="marker" src="${t.marker}" />${assets}</a-assets>
            <a-camera position="0 0 ${Math.max(1.8, aspect * 0.95)}" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
            ${lights}
            <a-entity drag-rotate rotation="-45 0 0">
              <a-entity id="target">
                <a-plane src="#marker" width="1" height="${aspect}" material="shader: flat"></a-plane>
                ${content}
              </a-entity>
            </a-entity>
          </a-scene>`;
        return;
      }

      // La escena se crea después de leer la config para poder fijar el .mind del tattoo
      stage.innerHTML = `
        <a-scene
          mindar-image="imageTargetSrc: ${t.target}; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; uiScanning: no"
          color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
          vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
          <a-assets>${assets}</a-assets>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          ${lights}
          <a-entity id="target" mindar-image-target="targetIndex: 0">
            ${content}
          </a-entity>
        </a-scene>`;

      const target = document.getElementById('target');
      target.addEventListener('targetFound', () => (hint.style.opacity = 0));
      target.addEventListener('targetLost', () => (hint.style.opacity = 1));
      stage.querySelector('a-scene').addEventListener('arError', () => {
        hint.textContent = 'No se pudo acceder a la cámara (¿permisos / HTTPS?)';
      });
    }

    main().catch((e) => {
      stage.innerHTML = `<p class="ar-error">${e.message}</p>`;
    });
  </script>
</body>
</html>
